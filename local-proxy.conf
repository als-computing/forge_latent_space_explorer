server {
    listen 80;

    # FastAPI docs — strip /lse, forward /docs and /redoc to lse-api
    location /lse/docs {
        proxy_pass http://lse-api:8081/docs;
        proxy_set_header Host $host;
    }
    location /lse/redoc {
        proxy_pass http://lse-api:8081/redoc;
        proxy_set_header Host $host;
    }

    # WebSocket — strip /lse/ws, forward to arroyo (SAS)
    location /lse/ws/ {
        proxy_pass http://arroyo:8765/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }

    # API — strip /api/v1, forward to lse-api
    location /api/v1/ {
        proxy_pass http://lse-api:8081/;
        proxy_set_header Host $host;
    }

    # UI — strip /lse, forward to lse-ui static server
    location /lse/ {
        proxy_pass http://lse-ui:5173/;
        proxy_set_header Host $host;
    }

    # Redirect bare /lse to /lse/
    location = /lse {
        return 301 /lse/;
    }
}
