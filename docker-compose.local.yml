services:
  local-proxy:
    image: nginx:alpine
    container_name: local-proxy
    ports:
      - "80:80"
    volumes:
      - ./local-proxy.conf:/etc/nginx/templates/default.conf.template:ro
    environment:
      ARROYO_HOST: ${ARROYO_HOST:-arroyo}
    depends_on:
      - lse-ui
      - lse-api
    networks:
      - mle_net

networks:
  web:
    external: false
